<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Your Snake run results." />
  <meta name="theme-color" content="#07110d" />
  <link rel="stylesheet" href="style.css?v=6" />
  <link rel="icon" href="img/thumbnail.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Madimi+One&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="script.js" defer></script>
  <title>Snake — Game Over</title>
</head>

<body class="result-page" data-page="gameover">
  <div class="ambient-orb ambient-orb--one" aria-hidden="true"></div>
  <div class="ambient-orb ambient-orb--two" aria-hidden="true"></div>
  <main class="result-shell">
    <a class="brand" href="index.html" aria-label="Snake home"><span class="brand-mark">S</span><span>SNAKE</span></a>
    <section class="dialog-card dialog-card--standalone dialog-card--gameover">
      <span class="dialog-icon dialog-icon--danger" aria-hidden="true">!</span>
      <p class="eyebrow">Run complete</p>
      <h1>Game over</h1>
      <p>Good run. The next high score is only one more game away.</p>
      <div class="dialog-stats dialog-stats--three">
        <div><span>Score</span><strong id="scorebtn">0</strong></div>
        <div><span>Best</span><strong id="highScorebtn">0</strong></div>
        <div><span>Time</span><strong id="timer">00:00</strong></div>
      </div>
      <div class="dialog-actions">
        <a class="button button--primary button--large" id="resetbtn" href="gamePage.html" onclick="resetGame()">Play again <span aria-hidden="true">&#8594;</span></a>
        <a class="text-link" href="index.html">Back to menu</a>
      </div>
    </section>
  </main>
</body>

</html>
